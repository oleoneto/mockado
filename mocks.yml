routes:
  - name: Comments v1
    path: /v1/comments
    methods: [GET]
    response:
      latency: 500ms
      status: 200
      headers:
        content-type: application/json
        X-Server-Home: "{{ env.HOME }}"
        X-Server-Shell: "{{ env.SHELL }}"
        X-Server-Path: "{{ env.PATH }}"
        X-Server-Db-User: "{{ env.DB_USER }}"
      body:
        comments:
          - id: 01JN443C15HRM89PSPX0Y2D68W
            text: I disagree 😩. They didn't even mention the best parts of the product
            parent_id: 01JN442DXJ41VTDPEG2MRTGYGG
            created_at: 1740671306280
          - id: 01JN442DXJ41VTDPEG2MRTGYGG
            text: That was an epic feedback!
            parent_id: null
            created_at: 1740670558818

  - name: Comments v2
    path: /v2/comments
    methods: [GET]
    response:
      status: 200
      latency: 2s
      body:
        comments:
          - id: 01JN443C15HRM89PSPX0Y2D68W
            text: I disagree 😩. They didn't even mention the best parts of the product
            parent_id: 01JN442DXJ41VTDPEG2MRTGYGG
            created_at: 1740671306280
          - id: 01JN442DXJ41VTDPEG2MRTGYGG
            text: That was an epic feedback!
            parent_id: null
            created_at: 1740670558818

  - name: Env Dump
    path: /env
    methods: [HEAD, GET]
    response:
      envAsBody: true
      status: 200

  - name: Hello
    path: /hello
    methods: [HEAD, GET]
    response:
      status: 200
      headers:
        contentType: text/html
      body: |
        <!doctype html>
        <html>
          <head>
            <meta charset="utf-8">
            <meta name="referrer" content="strict-origin-when-cross-origin">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>🐶 [Dog]</title>
          </head>
          <body>
            <main>
              <h1>What's up, dawg?</h1>
            </main>
          </body>
        </html>

  - name: "200"
    path: /200
    methods: [GET]
    response:
      status: 200
      latency: 50ms

  - name: "202"
    path: /202
    methods: [POST]
    response:
      status: 202
      latency: 2s

  - name: "404"
    path: /
    methods: [GET]
    response:
      status: 404
      headers:
        contentType: text/html
      body: |
        <!doctype html>
        <html>
          <head>
            <meta charset="utf-8">
            <meta name="referrer" content="strict-origin-when-cross-origin">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>😩 Path does not exist</title>
          </head>
          <body>
            <main>
              <h1>It appears you may be a little lost...</h1>
              <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdzlmY3I2OGh4M2YwNHp1N2d2ZnVjOTR5YmlkazVkMzA4ZXNpN3BsaSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/jU9OCvBiO1besabUKU/giphy.gif"></img>
            </main>
          </body>
        </html>

