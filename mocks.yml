routes:
  - name: Comments
    path: /comments
    methods:
    - HEAD
    - GET
    response:
      latency: 500ms
      status: 200
      headers:
        content-type: application/json
        X-Server-Home: "{{ env.HOME }}"
        X-Server-Shell: "{{ env.SHELL }}"
        X-Server-Path: "{{ env.PATH }}"
        X-Server-Db-User: "{{ env.DB_USER }}"
      body:
        comments:
          - id: 01JN443C15HRM89PSPX0Y2D68W
            text: I disagree 😩. They didn't even mention the best parts of the product
            parent_id: 01JN442DXJ41VTDPEG2MRTGYGG
            created_at: 1740671306280
          - id: 01JN442DXJ41VTDPEG2MRTGYGG
            text: That was an epic feedback!
            parent_id: null
            created_at: 1740670558818

  - name: Dump
    path: /dump
    methods:
      - HEAD
      - GET
    response:
      envAsBody: true
      status: 200

