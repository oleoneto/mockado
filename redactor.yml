version: v1
patterns:
  # Version Control & Git Platforms
  - name: "GitHub Fine-grained PAT"
    pattern: github_pat_[a-zA-Z0-9]{22}_[a-zA-Z0-9]{59}
  - name: "GitHub Classic PAT"
    pattern: ghp_[a-zA-Z0-9]{36}
  - name: "GitHub OAuth Access Token"
    pattern: gho_[a-zA-Z0-9]{36}
  - name: "GitLab Personal Access Token"
    pattern: glpat-[a-zA-Z0-9\-]{20}

  # Cloud Providers
  - name: "AWS Access Key ID"
    pattern: \b(AKIA|ASIA|AGPA|AIDA|AROA|AIPA)[A-Z0-9]{16}\b
  - name: "AWS Secret Access Key"
    pattern: (?i)aws(.{0,20})?['\"][0-9a-zA-Z\/+]{40}['\"]
  - name: "GCP API Key"
    pattern: \bAIza[0-9A-Za-z-_]{35}\b

  # AI & Developer Services
  - name: "OpenAI API Key"
    pattern: sk-(?:proj-|svcacct-|live-|test-)?[a-zA-Z0-9\-_]{80,}
  - name: "Anthropic API Key"
    pattern: sk-ant-sid01-[a-zA-Z0-9_\-]{93}
  - name: "Stripe Live Secret Key"
    pattern: sk_live_[0-9a-zA-Z]{24,}
  - name: "Slack Token"
    pattern: xox[bapr]-[0-9]{12}-[0-9]{12}-[a-zA-Z0-9]{24}

  # Generic & Cryptographic
  - name: "Asymmetric Private Key"
    pattern: "-----BEGIN (RSA|DSA|EC|OPENSSH|PGP)? PRIVATE KEY-----"
  - name: "JSON Web Token (JWT)"
    pattern: \beyj[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.?[A-Za-z0-9_-]*\b
  - name: "Generic Password/Key Assignment"
    pattern: (?i)\b(api[_\s-]?key|secret|password|passwd|token)\b\s*[:=]\s*['\"][A-Za-z0-9_\-]{16,}['\"]

  - name: PRIVATE VARS
    pattern: (AWS.*|DB.*|.*TOKEN|GH.*|.*BOT.*|.*KEY.*|.*SECRET.*|.*DATABASE.*URL)

  # - name: ALL
  #   pattern: ".*"
